<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community | CuriosityOS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyanGlow: '#22d3ee',
                        scienceBlue: '#020617',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .filter-btn.active { background: #22d3ee; color: #020617; box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }
    </style>
</head>
<body class="antialiased">

    <nav class="p-6 max-w-7xl mx-auto flex justify-between items-center relative z-50">
        <div class="flex items-center gap-4 cursor-pointer group" onclick="window.location.href='index.html'">
            <img src="https://i.ibb.co.com/pj0XT02b/image.png" alt="CuriosityOS Logo" class="w-12 h-12 object-contain group-hover:scale-110 transition-transform duration-300">
            <span class="text-white font-bold text-xl tracking-tight">CuriosityOS</span>
        </div>
        <a href="index.html" class="text-sm font-medium text-gray-400 hover:text-white transition-colors"></a>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="text-center mb-16">
            <h1 class="text-5xl font-bold mb-4">Our <span class="text-cyanGlow">Community</span></h1>
            <p class="text-gray-400 max-w-2xl mx-auto">Meet the researchers, developers and contributors driving CuriosityOS forward.</p>
        </div>

        <div class="flex flex-wrap justify-center gap-4 mb-12">
            <button onclick="filterCommunity('founding')" id="btn-founding" class="filter-btn active px-8 py-3 rounded-full border border-white/10 font-bold transition-all">Founding Members</button>
            <button onclick="filterCommunity('board')" id="btn-board" class="filter-btn px-8 py-3 rounded-full border border-white/10 font-bold text-gray-400 hover:text-white transition-all">Board Members</button>
            <button onclick="filterCommunity('')" id="btn-" class="filter-btn px-8 py-3 rounded-full border border-white/10 font-bold text-gray-400 hover:text-white transition-all">General Members</button>
        </div>

        <div id="members-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>
    </main>

    <script>
        const pb = new PocketBase('http://127.0.0.1:8090');

        async function filterCommunity(tier) {
            // 1. Update UI Button States
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'text-scienceBlue');
                btn.classList.add('text-gray-400');
            });
            const activeBtn = document.getElementById(`btn-${tier}`);
            activeBtn.classList.add('active', 'text-scienceBlue');
            activeBtn.classList.remove('text-gray-400');

            const grid = document.getElementById('members-grid');
            
            // 2. Animation Out
            await gsap.to(grid, { opacity: 0, y: 10, duration: 0.2 });
            grid.innerHTML = "";

            try {
                // 3. Dynamic Fetch Logic
                let fetchOptions = { sort: '-created' };
                
                // If checking Founding or Board, enforce authorization and specific tier
                if (tier === 'founding' || tier === 'board') {
                    fetchOptions.filter = `authorized = true && tier = "${tier}"`;
                } 
                // If checking General Members, remove authorization check
                else {
                    fetchOptions.filter = `tier = ""`; 
                }

                const records = await pb.collection('users').getFullList(fetchOptions);
                
                if (records.length === 0) {
                    const displayTier = tier === '' ? 'general member' : tier;
                    grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-600 font-medium">No ${displayTier}s found.</div>`;
                }

                // 4. Render Member Cards with Fallbacks
                let htmlContent = '';
                records.forEach(r => {
                    // Smart fallbacks in case a new user hasn't set up their profile yet
                    const displayName = r.name || "Curious Explorer";
                    const displayRole = r.role || (tier === '' ? 'General Member' : 'Member');
                    const displayBio = r.bio || 'Contributing to the CuriosityOS mission.';
                    const avatarUrl = r.avatar ? pb.files.getUrl(r, r.avatar) : `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=22d3ee&color=020617`;
                    
                    const card = `
                        <div onclick="window.location.href='profile.html?id=${r.id}'" 
                             class="glass-card p-6 rounded-3xl border border-white/5 hover:border-cyanGlow/30 transition-all group cursor-pointer hover:-translate-y-1 hover:shadow-2xl hover:shadow-cyanGlow/10">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-cyanGlow/20 group-hover:border-cyanGlow/50 transition-colors">
                                    <img src="${avatarUrl}" class="w-full h-full object-cover">
                                </div>
                                <div>
                                    <h3 class="font-bold text-white group-hover:text-cyanGlow transition-colors">${displayName}</h3>
                                    <p class="text-xs text-cyanGlow uppercase tracking-widest font-bold">${displayRole}</p>
                                </div>
                            </div>
                            <p class="text-gray-400 text-sm leading-relaxed line-clamp-3">${displayBio}</p>
                        </div>
                    `;
                    htmlContent += card;
                });
                grid.innerHTML = htmlContent;

            } catch (e) { 
                console.error("Fetch Error:", e);
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-red-400/50">Failed to connect to the community database.</div>`;
            }

            // 5. Animation In
            gsap.to(grid, { opacity: 1, y: 0, duration: 0.4 });
        }

        // Initialize view
        filterCommunity('founding');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community | CuriosityOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .filter-btn.active { background: #22d3ee; color: #020617; box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }
    </style>
</head>
<body class="antialiased">

    <nav class="p-6 max-w-7xl mx-auto flex justify-between items-center relative z-50">
        <div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='index.html'">
            <img src="https://i.ibb.co.com/pj0XT02b/image.png" alt="Logo" class="w-12 h-12 object-contain">
            <span class="text-white font-bold text-xl tracking-tight">CuriosityOS</span>
        </div>
        <a href="index.html" class="text-sm font-medium text-gray-400 hover:text-white transition-colors">BACK TO HOME</a>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="text-center mb-16">
            <h1 class="text-5xl font-bold mb-4">Our <span class="text-cyanGlow">Community</span></h1>
            <p class="text-gray-400 max-w-2xl mx-auto">Meet the researchers, developers and contributors driving CuriosityOS forward.</p>
        </div>

        <div class="flex flex-wrap justify-center gap-4 mb-12">
            <button onclick="filterCommunity('founding')" id="btn-founding" class="filter-btn active px-8 py-3 rounded-full border border-white/10 font-bold transition-all">Founding Members</button>
            <button onclick="filterCommunity('board')" id="btn-board" class="filter-btn px-8 py-3 rounded-full border border-white/10 font-bold text-gray-400 hover:text-white transition-all">Board Members</button>
            <button onclick="filterCommunity('members')" id="btn-members" class="filter-btn px-8 py-3 rounded-full border border-white/10 font-bold text-gray-400 hover:text-white transition-all">Members</button>
        </div>

        <div id="members-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <script>
        const pb = new PocketBase('http://127.0.0.1:8090');

        // Static Data for Founding & Board
        const staticMembers = {
            founding: [
                { name: "Prosun Datta", role: "Founder & CEO", avatar: "https://i.ibb.co.com/pj0XT02b/image.png", bio: "Leading the vision of CuriosityOS." },
                { name: "Dipto Singha", role: "Co-Founder & Operations", avatar: "https://i.ibb.co.com/pj0XT02b/image.png", bio: "Managing global operations and strategy." }
            ],
            board: [
                { name: "Board Seat Alpha", role: "Strategic Advisor", avatar: "", bio: "Advising on institutional research growth." }
            ]
        };

        async function filterCommunity(tier) {
            // Update UI Buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'text-white');
                btn.classList.add('text-gray-400');
            });
            document.getElementById(`btn-${tier}`).classList.add('active', 'text-scienceBlue');

            const grid = document.getElementById('members-grid');
            
            // Animation Out
            await gsap.to(grid, { opacity: 0, y: 20, duration: 0.2 });
            grid.innerHTML = "";

            let people = [];

            if (tier === 'members') {
                try {
                    // Fetch only 'authorized' users from PocketBase
                    const records = await pb.collection('users').getFullList({
                        filter: 'authorized = true', // Ensure you add an 'authorized' bool field in PB
                        sort: '-created',
                    });
                    people = records.map(r => ({
                        name: r.name,
                        role: r.class || "Member",
                        avatar: r.avatar ? pb.files.getUrl(r, r.avatar) : "https://ui-avatars.com/api/?name=" + r.name,
                        bio: r.institution || "Member of CuriosityOS"
                    }));
                } catch (e) { console.error("PB Fetch Error:", e); }
            } else {
                people = staticMembers[tier];
            }

            // Render Cards
            people.forEach(p => {
                const card = `
                    <div class="glass-card p-6 rounded-3xl border border-white/5 hover:border-cyanGlow/30 transition-all group">
                        <div class="flex items-center gap-4 mb-4">
                            <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-cyanGlow/20">
                                <img src="${p.avatar || 'https://ui-avatars.com/api/?name='+p.name}" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <h3 class="font-bold text-white group-hover:text-cyanGlow transition-colors">${p.name}</h3>
                                <p class="text-xs text-cyanGlow uppercase tracking-widest font-bold">${p.role}</p>
                            </div>
                        </div>
                        <p class="text-gray-400 text-sm leading-relaxed">${p.bio}</p>
                    </div>
                `;
                grid.innerHTML += card;
            });

            // Animation In
            gsap.to(grid, { opacity: 1, y: 0, duration: 0.4 });
        }

        // Initialize with Founding Members
        filterCommunity('founding');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuriosityOS - Identity</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { slate: { 950: '#030712' } }
                }
            }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.1/pocketbase.umd.js"></script>

    <style>
        body {
            background-color: #030712;
            background-image: radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.1) 0%, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        
        .form-section { display: none; opacity: 0; }
        .form-section.active { display: block; opacity: 1; }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500/30">

    <main class="w-full max-w-md p-6 relative z-10" id="main-container">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-extrabold italic tracking-tight text-white mb-2">
                CURIOSITY<span class="text-cyan-400">OS</span>
            </h1>
            <p class="text-sm text-gray-400 font-medium tracking-wide uppercase">Institutional Identity Portal</p>
        </div>

        <div class="glass-card rounded-3xl p-8 relative overflow-hidden" id="auth-card">
            
            <div id="signin-section" class="form-section active">
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold text-white mb-1">Welcome back</h2>
                    <p class="text-sm text-gray-400">Authenticate to access your workspace.</p>
                </div>

                <form id="signin-form" class="space-y-5">
                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Email / Username</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                            <input type="text" id="signin-email" required class="glass-input w-full rounded-2xl py-3 pl-12 pr-4 text-sm" placeholder="identity@institution.edu">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Passphrase</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                            <input type="password" id="signin-password" required class="glass-input w-full rounded-2xl py-3 pl-12 pr-4 text-sm" placeholder="••••••••••••">
                        </div>
                    </div>

                    <div id="signin-error" class="text-red-400 text-xs font-medium hidden mt-2 flex items-center gap-1">
                        <i data-lucide="alert-circle" class="w-3 h-3"></i>
                        <span>Authentication failed.</span>
                    </div>

                    <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-2xl py-3.5 mt-6 transition-all flex justify-center items-center gap-2">
                        <span>Authenticate</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-sm text-gray-400">No identity record? <button id="btn-to-signup" class="text-cyan-400 font-medium">Establish Identity</button></p>
                </div>
            </div>

            <div id="signup-section" class="form-section">
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold text-white mb-1">Establish Identity</h2>
                    <p class="text-sm text-gray-400">Register your institutional profile.</p>
                </div>

                <form id="signup-form" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Full Name</label>
                            <input type="text" id="signup-name" required class="glass-input w-full rounded-2xl py-3 px-4 text-sm">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Username</label>
                            <input type="text" id="signup-username" required class="glass-input w-full rounded-2xl py-3 px-4 text-sm">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Email</label>
                        <input type="email" id="signup-email" required class="glass-input w-full rounded-2xl py-3 px-4 text-sm">
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Passphrase</label>
                        <input type="password" id="signup-password" required minlength="8" class="glass-input w-full rounded-2xl py-3 px-4 text-sm">
                    </div>
                    
                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Confirm</label>
                        <input type="password" id="signup-passwordConfirm" required minlength="8" class="glass-input w-full rounded-2xl py-3 px-4 text-sm">
                    </div>

                    <div class="space-y-1 pt-1">
                        <label class="text-xs font-medium text-gray-400 uppercase tracking-wider ml-1">Avatar (Optional)</label>
                        <div class="file-input-wrapper glass-input rounded-2xl py-3 px-4 flex items-center justify-between">
                            <span id="file-name-display" class="text-sm text-gray-400">Select image...</span>
                            <input type="file" id="signup-avatar" accept="image/*">
                        </div>
                    </div>

                    <div id="signup-error" class="text-red-400 text-xs font-medium hidden mt-2 flex items-center gap-1">
                        <i data-lucide="alert-circle" class="w-3 h-3"></i>
                        <span id="signup-error-text">Creation failed.</span>
                    </div>

                    <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-2xl py-3.5 mt-6 transition-all flex justify-center items-center gap-2">
                        <span>Initialize Profile</span>
                        <i data-lucide="fingerprint" class="w-4 h-4"></i>
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-400">Identity established? <button id="btn-to-signin" class="text-cyan-400 font-medium">Authenticate</button></p>
                </div>
            </div>
            
            <div id="loading-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center z-50 hidden opacity-0">
                <i data-lucide="loader-2" class="w-8 h-8 text-cyan-400 animate-spin mb-4"></i>
                <p class="text-sm font-medium text-cyan-400 tracking-widest uppercase">Processing...</p>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const pb = new PocketBase('http://127.0.0.1:8090');
        pb.autoCancellation(false);

        const authCard = document.getElementById('auth-card');
        const signinSection = document.getElementById('signin-section');
        const signupSection = document.getElementById('signup-section');
        const loadingOverlay = document.getElementById('loading-overlay');
        const avatarInput = document.getElementById('signup-avatar');
        const fileNameDisplay = document.getElementById('file-name-display');

        // Initial Entry
        gsap.from("#main-container", { y: 50, opacity: 0, duration: 1, ease: "power3.out", delay: 0.2 });

        // Toggle
        function switchForm(hide, show) {
            gsap.to(hide, { opacity: 0, y: -10, duration: 0.3, onComplete: () => {
                hide.classList.remove('active');
                show.classList.add('active');
                gsap.fromTo(show, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 });
            }});
        }

        document.getElementById('btn-to-signup').onclick = () => switchForm(signinSection, signupSection);
        document.getElementById('btn-to-signin').onclick = () => switchForm(signupSection, signinSection);

        avatarInput.onchange = (e) => {
            fileNameDisplay.textContent = e.target.files.length ? e.target.files[0].name : 'Select image...';
        };

        function setLoading(isLoading) {
            if (isLoading) {
                loadingOverlay.classList.remove('hidden');
                gsap.to(loadingOverlay, { opacity: 1, duration: 0.3 });
            } else {
                gsap.to(loadingOverlay, { opacity: 0, duration: 0.3, onComplete: () => loadingOverlay.classList.add('hidden') });
            }
        }

        // SIGN IN
        document.getElementById('signin-form').onsubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            try {
                await pb.collection('users').authWithPassword(
                    document.getElementById('signin-email').value, 
                    document.getElementById('signin-password').value
                );
                // REDIRECT TO HOME
                window.location.href = 'index.html'; 
            } catch (err) {
                setLoading(false);
                document.getElementById('signin-error').classList.remove('hidden');
                gsap.fromTo(authCard, {x: -10}, {x: 10, duration: 0.1, yoyo: true, repeat: 5});
            }
        };

        // SIGN UP
        document.getElementById('signup-form').onsubmit = async (e) => {
            e.preventDefault();
            const pass = document.getElementById('signup-password').value;
            if (pass !== document.getElementById('signup-passwordConfirm').value) return alert("Passwords mismatch");

            setLoading(true);
            try {
                const fd = new FormData();
                fd.append('name', document.getElementById('signup-name').value);
                fd.append('username', document.getElementById('signup-username').value);
                fd.append('email', document.getElementById('signup-email').value);
                fd.append('password', pass);
                fd.append('passwordConfirm', pass);
                if (avatarInput.files[0]) fd.append('avatar', avatarInput.files[0]);

                await pb.collection('users').create(fd);
                await pb.collection('users').authWithPassword(document.getElementById('signup-email').value, pass);
                
                // REDIRECT TO HOME
                window.location.href = 'index.html'; 
            } catch (err) {
                setLoading(false);
                document.getElementById('signup-error').classList.remove('hidden');
                document.getElementById('signup-error-text').innerText = err.message;
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Lab | CuriosityOS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.1/pocketbase.umd.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #030712; 
            color: white; 
            background-image: radial-gradient(circle at 2px 2px, rgba(0, 210, 255, 0.03) 1px, transparent 0);
            background-size: 40px 40px;
        }
        
        .glass-card { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
    </style>
</head>
<body class="antialiased">

    <nav class="p-8 flex justify-between items-center max-w-7xl mx-auto">
        <a href="index.html" class="font-bold text-xl italic tracking-tighter">Curiosity<span class="text-cyan-400">OS</span></a>
        
        <div class="hidden md:flex flex-1 max-w-md mx-8 relative group">
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 group-focus-within:text-cyan-400 transition-colors"></i>
            <input type="text" id="search-input" placeholder="Search papers, authors, or topics..." class="w-full bg-white/5 border border-white/10 focus:border-cyan-400/50 rounded-full py-2 pl-11 pr-4 text-xs outline-none transition-all text-white placeholder:text-gray-600">
        </div>

        <div class="flex gap-4 items-center">
            <a href="edit-profile.html" class="text-[10px] font-bold uppercase tracking-widest text-gray-500 hover:text-white transition-colors">Dashboard</a>
            <a href="submit-research.html" class="bg-cyan-500 text-[#030712] px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest hover:scale-105 transition-transform shadow-[0_0_15px_rgba(0,210,255,0.2)]">Publish Paper</a>
        </div>
    </nav>

    <header class="py-12 text-center" id="page-header">
        <h1 class="text-4xl md:text-5xl font-extrabold italic mb-3">Research <span class="text-cyan-400">Lab</span></h1>
        <p class="text-gray-500 text-[10px] tracking-[0.3em] uppercase font-bold">Bangladeshi Youth Intelligence Database</p>
    </header>

    <main class="max-w-7xl mx-auto px-8 space-y-20 pb-24">
        
        <section id="my-research-section" class="hidden">
            <h2 class="text-[10px] font-black text-cyan-400 uppercase tracking-[0.4em] mb-6 flex items-center gap-2">
                <i data-lucide="folder-check" class="w-4 h-4"></i> My Published Work
            </h2>
            <div id="my-research-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section>
            <h2 class="text-[10px] font-black text-gray-500 uppercase tracking-[0.4em] mb-6 flex items-center gap-2">
                <i data-lucide="globe" class="w-4 h-4"></i> Global Intelligence Feed
            </h2>
            <div id="global-research-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="animate-pulse glass-card p-8 rounded-[2rem] h-48 border-cyan-400/20"></div>
                <div class="animate-pulse glass-card p-8 rounded-[2rem] h-48 border-white/5"></div>
                <div class="animate-pulse glass-card p-8 rounded-[2rem] h-48 border-white/5"></div>
            </div>
        </section>
    </main>

    <script>
        const pb = new PocketBase('https://pocketbase-production-5ec2.up.railway.app');
        lucide.createIcons();

        // Initial Header Animation
        gsap.from("#page-header", { y: -20, opacity: 0, duration: 1, ease: "power3.out" });

        async function loadResearch() {
            const user = pb.authStore.model;
            
            try {
                // 1. Fetch User's Specific Research (if logged in)
                if (user) {
                    const myRes = await pb.collection('research').getList(1, 6, { filter: `author = "${user.id}"`, sort: '-created' });
                    if (myRes.items.length > 0) {
                        document.getElementById('my-research-section').classList.remove('hidden');
                        renderGrid(myRes.items, 'my-research-grid', true);
                    }
                }

                // 2. Fetch Global Community Research
                const globalRes = await pb.collection('research').getList(1, 15, { expand: 'author', sort: '-created' });
                renderGrid(globalRes.items, 'global-research-grid', false);

                // Animate cards on load
                gsap.from(".glass-card", { y: 20, opacity: 0, stagger: 0.1, duration: 0.6, ease: "power2.out" });

            } catch (error) {
                console.log("No data found or database offline.");
                document.getElementById('global-research-grid').innerHTML = `<p class="text-gray-500 text-xs uppercase tracking-widest col-span-full">Awaiting Database Connection...</p>`;
            }
        }

        function renderGrid(items, containerId, isOwner) {
            const container = document.getElementById(containerId);
            if(items.length === 0) return;

            container.innerHTML = items.map(item => `
                <div class="glass-card p-8 rounded-[2rem] hover:border-cyan-400/40 hover:bg-white/[0.04] transition-all duration-300 group flex flex-col justify-between min-h-[220px]">
                    <div>
                        <div class="flex justify-between items-start mb-5">
                            <div class="w-10 h-10 rounded-xl bg-cyan-400/10 flex items-center justify-center text-cyan-400 group-hover:scale-110 transition-transform">
                                <i data-lucide="file-text" class="w-5 h-5"></i>
                            </div>
                            ${isOwner ? '<span class="text-[8px] font-black bg-cyan-400/20 text-cyan-400 px-2 py-1 rounded-md uppercase tracking-widest">Your File</span>' : ''}
                        </div>
                        <h3 class="font-bold text-lg mb-2 leading-tight">${item.title || 'Untitled Research'}</h3>
                        <p class="text-gray-500 text-xs line-clamp-2 mb-6">${item.abstract || 'No abstract provided for this document.'}</p>
                    </div>
                    <div class="flex items-center justify-between border-t border-white/5 pt-5 mt-auto">
                        <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">${item.expand?.author?.name || 'Independent Researcher'}</span>
                        <button class="text-cyan-400 text-[10px] font-black uppercase tracking-widest hover:text-white transition-colors">Open <i data-lucide="arrow-up-right" class="inline w-3 h-3"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // Initialize Data Fetching
        loadResearch();

        // Basic Search Bar Listener (For future expansion)
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            // This is where you will add logic to filter the PocketBase records based on the query.
            console.log("Searching for:", query); 
        });
    </script>
</body>
</html>
